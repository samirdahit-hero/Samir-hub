<script>
    /* =====================================================================
       THREE.JS 3D BACKGROUND RENDERER (Transparent Box Edition)
    ===================================================================== */
    const heroCanvas = document.getElementById('hero-webgl');
    let heroRenderer, heroScene, heroCamera, heroGroup, torusKnot, wirePoly;
    let heroAnimFrameId;
    let heroPointerX = 0, heroPointerY = 0;
    let heroTargetX = 0, heroTargetY = 0;

    function initHeroThree() {
      if (!heroCanvas) return;
      heroScene = new THREE.Scene();
      
      const width = window.innerWidth;
      const height = window.innerHeight;

      heroCamera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
      heroCamera.position.z = 5.2;

      heroRenderer = new THREE.WebGLRenderer({
        canvas: heroCanvas,
        alpha: true,
        antialias: true,
        powerPreference: 'high-performance'
      });
      heroRenderer.setSize(width, height);
      heroRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      heroScene.add(ambientLight);

      const light1 = new THREE.PointLight(0x00f5a0, 2.5, 50);
      light1.position.set(5, 5, 5);
      heroScene.add(light1);

      const light2 = new THREE.PointLight(0xe2ba73, 2.8, 50);
      light2.position.set(-5, -4, 4);
      heroScene.add(light2);

      heroGroup = new THREE.Group();

      const knotGeo = new THREE.TorusKnotGeometry(1.2, 0.28, 128, 32, 2, 3);
      const knotMat = new THREE.MeshStandardMaterial({
        color: 0x1a1a24,
        roughness: 0.2,
        metalness: 0.85,
        emissive: 0x221a0f,
        emissiveIntensity: 0.6,
        wireframe: false
      });
      torusKnot = new THREE.Mesh(knotGeo, knotMat);
      heroGroup.add(torusKnot);

      const icoGeo = new THREE.IcosahedronGeometry(1.9, 2);
      const icoMat = new THREE.MeshBasicMaterial({
        color: 0x00f5a0,
        wireframe: true,
        transparent: true,
        opacity: 0.35
      });
      wirePoly = new THREE.Mesh(icoGeo, icoMat);
      heroGroup.add(wirePoly);

      const particleCount = 120;
      const particleGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 12;
      }
      particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const particleMat = new THREE.PointsMaterial({
        size: 0.035,
        color: 0xe2ba73,
        transparent: true,
        opacity: 0.7
      });
      const particles = new THREE.Points(particleGeo, particleMat);
      heroGroup.add(particles);

      heroScene.add(heroGroup);

      window.addEventListener('pointermove', (e) => {
        heroPointerX = (e.clientX / window.innerWidth - 0.5) * 1.5;
        heroPointerY = (e.clientY / window.innerHeight - 0.5) * 1.5;
      });

      window.addEventListener('resize', () => {
        if (!heroRenderer || !heroCamera) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        heroCamera.aspect = w / h;
        heroCamera.updateProjectionMatrix();
        heroRenderer.setSize(w, h);
      });

      function renderHero() {
        heroAnimFrameId = requestAnimationFrame(renderHero);
        heroTargetX += (heroPointerX - heroTargetX) * 0.05;
        heroTargetY += (heroPointerY - heroTargetY) * 0.05;

        torusKnot.rotation.x += 0.005;
        torusKnot.rotation.y += 0.007;

        wirePoly.rotation.x -= 0.003;
        wirePoly.rotation.y -= 0.004;

        heroGroup.rotation.y = heroTargetX * 0.8;
        heroGroup.rotation.x = heroTargetY * 0.8;

        heroRenderer.render(heroScene, heroCamera);
      }
      renderHero();
    }

    function playBeep() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(850, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.08);
    }

    initHeroThree();
</script>
